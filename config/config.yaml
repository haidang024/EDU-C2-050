# Runtime configuration — EDU-C2-050 (SafeguardingPolicyChangeAgent)
#
# Static identity lives in config/agent.yaml.
# Values here are runtime-tunable; safe coded defaults apply when this file is
# absent. Static identity and compile-time requirements stay in agent.yaml.

# ── AgentBaseGraph backbone parameters ──────────────────────────────────
max_retry: 1
timeout_s: 60
memory_enabled: false
# This released template is exercised by the provisional STG adapter with
# synthetic connector data; production deployments override this to false.
stg_mock_mode: false

hitl:
  enabled: false

# ── Secrets key names (resolved per-invocation via ctx.secrets.require()) ──
source_connector_secret_key: "SOURCE_CONNECTOR_TOKEN"

# ── LLM parameters ───────────────────────────────────────────────────────
llm_provider: "azure_openai"
llm_model: "azure-openai-deployment"
llm_timeout_s: 15
llm_narrative_timeout_s: 15

# Caps serial per-section LLM classification calls per invocation. The provider is
# called once per changed section, so wall-clock grows linearly with section count;
# without this bound a slow provider makes the agent look hung in Marketplace Chat.
# Sections past the cap use the deterministic classifier and are flagged
# needs_human_confirmation. Raise it for batch/offline runs where latency is not a
# concern. 0 disables LLM classification entirely.
max_llm_classifications: 6

# ── Retrieval / source parameters ────────────────────────────────────────
max_baseline_age_days: 365

# ── Change significance thresholds ───────────────────────────────────────
significance_thresholds:
  high: 0.8
  medium: 0.5

# ── Sanitization patterns applied to retrieved source content before LLM ─
# Patterns are Python regex strings matched against individual lines.
source_sanitization_patterns:
  - "\\b\\d{1,3}\\s\\w+\\s(?:Street|Road|Lane|Avenue|Drive|Close|Court)\\b"  # street addresses
  - "\\b[A-Z]{1,2}\\d{1,2}\\s?\\d[A-Z]{2}\\b"   # UK postcodes
  - "\\b(?:0\\d{9,10}|\\+44\\d{9,10})\\b"        # UK phone numbers
  - "\\b[A-Za-z0-9._%+\\-]+@[A-Za-z0-9.\\-]+\\.[A-Za-z]{2,}\\b"  # email addresses
  - "\\b[A-Z]{2}\\d{6}[A-Z]\\b"                  # NI numbers
  - "(?i)\\bcase\\s*(?:ref|reference|no|number)[:\\s]+\\S+"  # case references

# ── Output credential scan patterns (S-3 output gate) ────────────────────
output_credential_patterns:
  - "(?i)(api[_\\-]?key|secret|password|token|bearer)[=:\\s]+\\S+"
  - "\\bsk-[A-Za-z0-9]{20,}\\b"   # OpenAI-style API keys
  - "\\b[A-Za-z0-9+/]{40,}={0,2}\\b"  # base64 credential blobs (>=40 chars)
