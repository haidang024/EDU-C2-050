# AgentRegistry manifest for EDU-C2-050. Registry keys must remain at root.
id: "EDU-C2-050"
name: "SafeguardingPolicyChangeAgent"
namespace: "agent1000"
version: "1.0.3"
enabled: true
category: "Cat 2"
generation_mode: "llm"
industry: "EDU"

# Compatibility metadata; Graph directly inherits AgentBaseGraph.
base_type: "AgentBaseGraph"
class: "src.graph.graph.Graph"

# Authenticated callers only; ANONYMOUS is rejected at the S-1 gate.
required_trust_level: "VERIFIED_EXTERNAL"

# SOURCE_CONNECTOR_TOKEN and Azure OpenAI credentials are invocation-scoped.
# Provider failures preserve the deterministic review output.
requires:
  secrets:
    - "SOURCE_CONNECTOR_TOKEN"
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]
